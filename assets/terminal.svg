    </text>

    <text x="28" y="186">
      <tspan fill="#3dd6c6">$</tspan>
      <tspan dx="10" fill="#8b949e">currently_building</tspan>
      <tspan dx="14" fill="#6ea8fe">Ticket Engine</tspan>
      <tspan fill="#21262d">  &#183;  </tspan>
      <tspan fill="#6ea8fe">CareerOS</tspan>
      <tspan fill="#21262d">  &#183;  </tspan>
