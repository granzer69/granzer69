<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Terminal: whoami, focus, currently building">
  <title>Terminal</title>
  <defs>
    <linearGradient id="termTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#12181f"/>
    </linearGradient>
    <linearGradient id="termEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3dd6c6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6ea8fe" stop-opacity="0.15"/>
    </linearGradient>
    <pattern id="termGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 H0 V24" fill="none" stroke="#21262d" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="900" height="220" rx="10" fill="#0b0f14"/>
  <rect x="1" y="1" width="898" height="218" rx="10" fill="none" stroke="url(#termEdge)" stroke-width="1.5"/>
  <rect x="3" y="3" width="894" height="214" rx="8" fill="#12181f" stroke="#21262d" stroke-width="1"/>
  <rect x="8" y="36" width="884" height="176" fill="url(#termGrid)" opacity="0.35"/>

  <rect x="3" y="3" width="894" height="32" rx="8" fill="url(#termTop)"/>
  <rect x="3" y="20" width="894" height="16" fill="#161b22"/>
  <circle cx="22" cy="19" r="5" fill="#21262d" stroke="#3dd6c6" stroke-width="0.75" opacity="0.6"/>
  <circle cx="40" cy="19" r="5" fill="#21262d" stroke="#6ea8fe" stroke-width="0.75" opacity="0.45"/>
  <circle cx="58" cy="19" r="5" fill="#21262d"/>
  <text x="450" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">granzer69 &#8212; zsh</text>
  <g stroke="#3dd6c6" stroke-width="1" fill="none" opacity="0.4">
