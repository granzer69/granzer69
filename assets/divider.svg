<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" role="img" aria-label="Section divider">
  <title>Divider</title>
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3dd6c6" stop-opacity="0"/>
      <stop offset="35%" stop-color="#3dd6c6" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#6ea8fe" stop-opacity="0.75"/>
