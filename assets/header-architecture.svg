        font-size="17" font-weight="600" letter-spacing="2" fill="#e6edf3">Architecture &#8212; Ticket Engine</text>
  <rect x="300" y="40" width="0" height="2" fill="url(#hSweepA)">
    <animate attributeName="x" values="300;600;300" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="width" values="0;140;0" dur="5.5s" repeatCount="indefinite"/>
  </rect>
