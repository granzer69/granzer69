<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Ticket Engine architecture: User to Go API to Redis to Worker to MySQL">
  <title>Ticket Engine Architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6ea8fe"/>
    </marker>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="archGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0 H0 V20" fill="none" stroke="#21262d" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <linearGradient id="archBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3dd6c6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6ea8fe" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <rect width="900" height="300" rx="8" fill="#0b0f14"/>
  <rect x="1" y="1" width="898" height="298" rx="8" fill="url(#archGrid)"/>
  <rect x="1" y="1" width="898" height="298" rx="8" fill="none" stroke="url(#archBorder)" stroke-width="1.5"/>

  <g stroke="#3dd6c6" stroke-width="1" fill="none" opacity="0.45">
    <path d="M16 16 H40 M16 16 V40"/>
    <path d="M884 16 H860 M884 16 V40"/>
    <path d="M16 284 H40 M16 284 V260"/>
    <path d="M884 284 H860 M884 284 V260"/>
  </g>

  <text x="28" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#8b949e">TICKET ENGINE &#183; DATA PATH</text>
  <line x1="28" y1="48" x2="220" y2="48" stroke="#3dd6c6" stroke-width="1" opacity="0.6"/>
  <rect x="28" y="46" width="40" height="2" fill="#6ea8fe" opacity="0.7">
    <animate attributeName="x" values="28;200;28" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g>
    <rect x="28" y="108" width="110" height="64" rx="6" fill="#12181f" stroke="#21262d" stroke-width="1.5"/>
    <rect x="28" y="108" width="110" height="3" rx="6" fill="#21262d"/>
    <text x="83" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e6edf3">USER</text>
    <text x="83" y="154" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">POST /book</text>
  </g>

  <g>
    <rect x="178" y="108" width="120" height="64" rx="6" fill="#12181f" stroke="#3dd6c6" stroke-width="1.5"/>
    <text x="238" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e6edf3">GO API</text>
    <text x="238" y="154" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#3dd6c6">net/http</text>
  </g>

  <g>
    <rect x="348" y="96" width="160" height="88" rx="6" fill="#12181f" stroke="#3dd6c6" stroke-width="1.75" filter="url(#softGlow)">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <text x="428" y="126" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e6edf3">REDIS</text>
    <text x="428" y="144" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#3dd6c6">Lua atomic alloc</text>
    <text x="428" y="160" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6ea8fe">Streams (XADD)</text>
  </g>

  <g>
    <rect x="558" y="108" width="120" height="64" rx="6" fill="#12181f" stroke="#6ea8fe" stroke-width="1.5"/>
    <text x="618" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e6edf3">WORKER</text>
    <text x="618" y="154" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6ea8fe">stream consumer</text>
  </g>

  <g>
    <rect x="718" y="108" width="150" height="64" rx="6" fill="#12181f" stroke="#21262d" stroke-width="1.5"/>
    <text x="793" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#e6edf3">MYSQL</text>
    <text x="793" y="154" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">persistence</text>
  </g>

  <g stroke="#6ea8fe" stroke-width="1.5" fill="none" marker-end="url(#arrow)" opacity="0.85">
    <line x1="138" y1="140" x2="172" y2="140"/>
    <line x1="298" y1="140" x2="342" y2="140"/>
    <line x1="508" y1="140" x2="552" y2="140"/>
    <line x1="678" y1="140" x2="712" y2="140"/>
  </g>
  <circle r="3" fill="#3dd6c6" opacity="0.9">
    <animateMotion dur="3s" repeatCount="indefinite" path="M138,140 L172,140 L298,140 L342,140 L508,140 L552,140 L678,140 L712,140"/>
  </circle>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">
    <text x="28" y="228" fill="#8b949e">
      <tspan fill="#3dd6c6">●</tspan>
      <tspan dx="6" fill="#8b949e">atomic allocation</tspan>
      <tspan dx="18" fill="#21262d">|</tspan>
      <tspan dx="18" fill="#3dd6c6">●</tspan>
      <tspan dx="6" fill="#8b949e">queue / stream processing</tspan>
      <tspan dx="18" fill="#21262d">|</tspan>
      <tspan dx="18" fill="#3dd6c6">●</tspan>
      <tspan dx="6" fill="#8b949e">persistence</tspan>
      <tspan dx="18" fill="#21262d">|</tspan>
      <tspan dx="18" fill="#3dd6c6">●</tspan>
      <tspan dx="6" fill="#8b949e">concurrency</tspan>
    </text>
    <text x="28" y="258" fill="#6ea8fe" opacity="0.8">Docker Compose &#183; k6 load scripts &#183; idempotent retries</text>
  </g>
</svg>
