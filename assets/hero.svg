<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" width="1100" height="220" role="img" aria-label="Ribhu Siripurapu — AI / Backend / Systems Engineering">
  <title>Ribhu Siripurapu</title>
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3dd6c6" stop-opacity="0"/>
      <stop offset="40%" stop-color="#3dd6c6" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#6ea8fe" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#6ea8fe" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1" opacity="0.55"/>
    </pattern>
    <clipPath id="typeClip">
      <rect x="56" y="118" width="0" height="36">
        <animate attributeName="width" values="0;520;520;520;0" keyTimes="0;0.35;0.7;0.85;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1100" height="220" fill="#0b0f14"/>
  <rect width="1100" height="220" fill="url(#grid)" opacity="0.45"/>

  <!-- Soft particles (sparse) -->
  <g opacity="0.35" fill="#3dd6c6">
    <circle cx="180" cy="48" r="1.5">
      <animate attributeName="opacity" values="0.15;0.55;0.15" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="420" cy="32" r="1.2" fill="#6ea8fe">
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="5.1s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="56" r="1.4">
      <animate attributeName="opacity" values="0.12;0.48;0.12" dur="3.8s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="40" r="1.1" fill="#6ea8fe">
      <animate attributeName="opacity" values="0.1;0.45;0.1" dur="4.7s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="190" r="1.3">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="5.5s" begin="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="290" cy="175" r="1.1" fill="#6ea8fe">
      <animate attributeName="opacity" values="0.12;0.42;0.12" dur="4.4s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Accent corner marks -->
  <g stroke="#3dd6c6" stroke-width="1.25" fill="none" opacity="0.55">
    <path d="M24 24 H52 M24 24 V52"/>
    <path d="M1076 24 H1048 M1076 24 V52"/>
    <path d="M24 196 H52 M24 196 V168"/>
    <path d="M1076 196 H1048 M1076 196 V168"/>
  </g>

  <!-- Title -->
  <text x="56" y="88"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="42" font-weight="700" letter-spacing="6"
        fill="#e6edf3">RIBHU SIRIPURAPU</text>

  <!-- Subtle scanline under title -->
  <rect x="56" y="102" width="420" height="1.5" fill="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="0.45;0.95;0.45" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Prompt prefix -->
  <text x="56" y="142"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" fill="#3dd6c6">&gt;</text>

  <!-- Typed subtitle (clip reveal) -->
  <text x="78" y="142"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" letter-spacing="2.5" fill="#8b949e"
        clip-path="url(#typeClip)">AI / BACKEND / SYSTEMS ENGINEERING</text>

  <!-- Blinking cursor -->
  <rect x="78" y="126" width="10" height="20" fill="#3dd6c6">
    <animate attributeName="x" values="78;598;598;598;78" keyTimes="0;0.35;0.7;0.85;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.45;0.7;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom status strip -->
  <text x="56" y="188"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="12" letter-spacing="1.5" fill="#21262d">
    <tspan fill="#6ea8fe">granzer69</tspan>
    <tspan fill="#21262d">  ·  </tspan>
    <tspan fill="#8b949e">concurrent systems · applied ML · production APIs</tspan>
  </text>
</svg>
