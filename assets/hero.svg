<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 260" width="1100" height="260" role="img" aria-label="Ribhu Siripurapu &#8212; AI / Backend / Systems Engineering">
  <title>Ribhu Siripurapu</title>
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3dd6c6" stop-opacity="0"/>
      <stop offset="40%" stop-color="#3dd6c6" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#6ea8fe" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#6ea8fe" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3dd6c6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0b0f14" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1" opacity="0.55"/>
    </pattern>
    <clipPath id="typeClip">
      <rect x="56" y="138" width="0" height="36">
        <animate attributeName="width" values="0;520;520;520;0" keyTimes="0;0.35;0.7;0.85;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="260" fill="#0b0f14"/>
  <rect width="1100" height="260" fill="url(#grid)" opacity="0.4"/>

  <!-- Perspective floor -->
  <g opacity="0.35" transform="translate(550 200)">
    <path d="M-480 0 L480 0 L320 90 L-320 90 Z" fill="url(#floorFade)" stroke="none"/>
    <g stroke="#21262d" stroke-width="0.75" fill="none">
      <line x1="-320" y1="90" x2="320" y2="90"/>
      <line x1="-280" y1="72" x2="280" y2="72" opacity="0.7"/>
      <line x1="-240" y1="54" x2="240" y2="54" opacity="0.5"/>
      <line x1="-200" y1="36" x2="200" y2="36" opacity="0.35"/>
      <line x1="-320" y1="90" x2="-200" y2="36"/>
      <line x1="-160" y1="90" x2="-100" y2="36"/>
      <line x1="0" y1="90" x2="0" y2="36"/>
      <line x1="160" y1="90" x2="100" y2="36"/>
      <line x1="320" y1="90" x2="200" y2="36"/>
    </g>
    <rect x="-200" y="0" width="400" height="2" fill="#3dd6c6" opacity="0.25">
      <animate attributeName="opacity" values="0.1;0.45;0.1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Scanlines -->
  <g opacity="0.06">
    <rect x="0" y="0" width="1100" height="260" fill="#3dd6c6"/>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#0b0f14"/>
    </pattern>
    <rect width="1100" height="260" fill="url(#scan)"/>
  </g>

  <!-- Circuit trace -->
  <g stroke="#3dd6c6" stroke-width="1" fill="none" opacity="0.35">
    <path d="M900 48 H820 V72 H760"/>
    <circle cx="760" cy="72" r="2.5" fill="#3dd6c6" stroke="none"/>
    <path d="M920 180 H860 V156 H800"/>
    <circle cx="800" cy="156" r="2" fill="#6ea8fe" stroke="none"/>
    <path d="M120 200 H180 V176 H240" stroke="#6ea8fe"/>
    <circle cx="240" cy="176" r="2" fill="#6ea8fe" stroke="none"/>
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- Orbit ring -->
  <g transform="translate(980 55)" opacity="0.5">
    <circle r="28" fill="none" stroke="#21262d" stroke-width="1"/>
    <circle r="28" fill="none" stroke="#3dd6c6" stroke-width="1" stroke-dasharray="8 40" stroke-opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#3dd6c6" filter="url(#nodeGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="28;28" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="0;0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="28" cy="0" r="2.5" fill="#6ea8fe">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="18s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g opacity="0.35" fill="#3dd6c6">
    <circle cx="180" cy="48" r="1.5"><animate attributeName="opacity" values="0.15;0.55;0.15" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="32" r="1.2" fill="#6ea8fe"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="5.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="56" r="1.4"><animate attributeName="opacity" values="0.12;0.48;0.12" dur="3.8s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <g stroke="#3dd6c6" stroke-width="1.5" fill="none" opacity="0.65">
    <path d="M20 20 H56 M20 20 V56"/>
    <path d="M1080 20 H1044 M1080 20 V56"/>
    <path d="M20 240 H56 M20 240 V204"/>
    <path d="M1080 240 H1044 M1080 240 V204"/>
    <path d="M56 20 H72 M56 20 V36" stroke-width="1" opacity="0.5"/>
    <path d="M1044 20 H1028 M1044 20 V36" stroke-width="1" opacity="0.5"/>
  </g>

  <text x="56" y="92"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="42" font-weight="700" letter-spacing="6" fill="#e6edf3">RIBHU SIRIPURAPU</text>

  <rect x="56" y="106" width="420" height="1.5" fill="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="0.45;0.95;0.45" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <text x="56" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#3dd6c6">&gt;</text>
  <text x="78" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2.5" fill="#8b949e" clip-path="url(#typeClip)">AI / BACKEND / SYSTEMS ENGINEERING</text>

  <rect x="78" y="136" width="10" height="20" fill="#3dd6c6">
    <animate attributeName="x" values="78;598;598;598;78" keyTimes="0;0.35;0.7;0.85;1" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;1" keyTimes="0;0.45;0.7;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <rect x="56" y="218" width="988" height="1" fill="#21262d" opacity="0.8"/>
  <text x="56" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#21262d">
    <tspan fill="#6ea8fe">granzer69</tspan>
    <tspan fill="#21262d">  &#183;  </tspan>
    <tspan fill="#8b949e">concurrent systems &#183; applied ML &#183; production APIs</tspan>
  </text>
</svg>
