<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 248" width="520" height="248" role="img" aria-label="Stock-Market-Predictor project card">
  <title>Stock-Market-Predictor</title>
  <defs>
    <linearGradient id="cardEdgeS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3dd6c6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#21262d" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="520" height="248" rx="8" fill="#0b0f14"/>
  <rect x="1" y="1" width="518" height="246" rx="7" fill="#12181f" stroke="url(#cardEdgeS)" stroke-width="1.25"/>
  <g transform="translate(20 18)">
    <rect x="0" y="0" width="36" height="36" rx="6" fill="#0b0f14" stroke="#3dd6c6" stroke-width="1.25"/>
    <polyline points="8,26 14,20 20,22 28,10" fill="none" stroke="#6ea8fe" stroke-width="1.5"/>
  </g>
  <text x="68" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#e6edf3">Stock-Market-Predictor</text>
  <line x1="20" y1="58" x2="500" y2="58" stroke="#21262d" stroke-width="1"/>
  <text x="20" y="82" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12.5" fill="#8b949e">
    <tspan x="20" dy="0">Keras sequence model for next-day close prediction,</tspan>
    <tspan x="20" dy="18">FastAPI inference, and a Next.js dashboard over historical</tspan>
    <tspan x="20" dy="18">CSV data.</tspan>
  </text>
  <text x="20" y="152" font-family="ui-monospace, monospace" font-size="11" fill="#3dd6c6">TensorFlow/Keras &#183; FastAPI &#183; Next.js</text>
  <rect x="20" y="168" width="480" height="58" rx="4" fill="#0b0f14" stroke="#21262d" stroke-width="1"/>
  <text x="28" y="188" font-family="ui-monospace, monospace" font-size="10" fill="#6ea8fe">Engineering signal:</text>
  <text x="28" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8b949e">
    <tspan x="28" dy="0">training &#8594; inference API &#8594; dashboard, not a notebook-only</tspan>
    <tspan x="28" dy="16">demo.</tspan>
  </text>
</svg>
