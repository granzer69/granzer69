<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 52" width="900" height="52" role="img" aria-label="Activity">
  <title>Activity</title>
  <defs>
    <linearGradient id="hSweepAct" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ea8fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3dd6c6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6ea8fe" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="52" fill="#0b0f14"/>
  <text x="450" y="32" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="18" font-weight="600" letter-spacing="3" fill="#e6edf3">Activity</text>
  <rect x="360" y="40" width="0" height="2" fill="url(#hSweepAct)">
    <animate attributeName="x" values="360;540;360" dur="5.2s" repeatCount="indefinite"/>
    <animate attributeName="width" values="0;80;0" dur="5.2s" repeatCount="indefinite"/>
  </rect>
  <line x1="200" y1="44" x2="380" y2="44" stroke="#21262d" stroke-width="1"/>
  <line x1="520" y1="44" x2="700" y2="44" stroke="#21262d" stroke-width="1"/>
  <text x="28" y="28" font-family="ui-monospace, monospace" font-size="11" fill="#3dd6c6" opacity="0.7">//</text>
</svg>
