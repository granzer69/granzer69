<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 248" width="520" height="248" role="img" aria-label="Plant-Disease-Classification project card">
  <title>Plant-Disease-Classification</title>
  <defs>
    <linearGradient id="cardEdgeP" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6ea8fe" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#21262d" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="520" height="248" rx="8" fill="#0b0f14"/>
  <rect x="1" y="1" width="518" height="246" rx="7" fill="#12181f" stroke="url(#cardEdgeP)" stroke-width="1.25"/>
  <g transform="translate(20 18)">
    <rect x="0" y="0" width="36" height="36" rx="6" fill="#0b0f14" stroke="#3dd6c6" stroke-width="1.25"/>
    <path d="M18 28 C18 28 10 22 10 16 C10 12 14 10 18 14 C22 10 26 12 26 16 C26 22 18 28 18 28 Z" fill="none" stroke="#3dd6c6" stroke-width="1.25"/>
  </g>
  <text x="68" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#e6edf3">Plant-Disease-Classification</text>
  <line x1="20" y1="58" x2="500" y2="58" stroke="#21262d" stroke-width="1"/>
  <text x="20" y="82" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12.5" fill="#8b949e">
    <tspan x="20" dy="0">CNN leaf-disease classifier (38 classes) with an inference</tspan>
    <tspan x="20" dy="18">UI. Validation accuracy ~91% from training history on the</tspan>
    <tspan x="20" dy="18">held-out split.</tspan>
  </text>
  <text x="20" y="152" font-family="ui-monospace, monospace" font-size="11" fill="#3dd6c6">TensorFlow/Keras &#183; Python</text>
  <rect x="20" y="168" width="480" height="58" rx="4" fill="#0b0f14" stroke="#21262d" stroke-width="1"/>
  <text x="28" y="188" font-family="ui-monospace, monospace" font-size="10" fill="#6ea8fe">Engineering signal:</text>
  <text x="28" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8b949e">
    <tspan x="28" dy="0">multi-class CNN with recorded ~91% val accuracy.</tspan>
  </text>
