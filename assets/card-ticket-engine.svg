<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 248" width="520" height="248" role="img" aria-label="Ticket-Engine project card">
  <title>Ticket-Engine</title>
  <defs>
    <linearGradient id="cardEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3dd6c6" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#21262d" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="520" height="248" rx="8" fill="#0b0f14"/>
  <rect x="1" y="1" width="518" height="246" rx="7" fill="#12181f" stroke="url(#cardEdge)" stroke-width="1.25"/>
  <g transform="translate(20 18)">
    <rect x="0" y="0" width="36" height="36" rx="6" fill="#0b0f14" stroke="#3dd6c6" stroke-width="1.25"/>
    <path d="M8 22 H28 M8 14 H22" stroke="#3dd6c6" stroke-width="1.5" fill="none"/>
    <circle cx="28" cy="14" r="2" fill="#6ea8fe"/>
  </g>
  <text x="68" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#e6edf3">Ticket-Engine</text>
  <line x1="20" y1="58" x2="500" y2="58" stroke="#21262d" stroke-width="1"/>
  <text x="20" y="82" font-family="ui-sans-serif, system-ui, Segoe UI, sans-serif" font-size="12.5" fill="#8b949e">
    <tspan x="20" dy="0">High-concurrency booking path: Go API &#8594; Redis Lua</tspan>
    <tspan x="20" dy="18">atomic allocation + Streams &#8594; worker &#8594; MySQL.</tspan>
    <tspan x="20" dy="18">Docker Compose local stack and k6 load scripts.</tspan>
  </text>
  <text x="20" y="152" font-family="ui-monospace, monospace" font-size="11" fill="#3dd6c6">Go &#183; Redis &#183; MySQL &#183; Docker &#183; k6</text>
  <rect x="20" y="168" width="480" height="58" rx="4" fill="#0b0f14" stroke="#21262d" stroke-width="1"/>
  <text x="28" y="188" font-family="ui-monospace, monospace" font-size="10" fill="#6ea8fe">Engineering signal:</text>
  <text x="28" y="206" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8b949e">
    <tspan x="28" dy="0">Lua-atomic allocation + idempotent retries under</tspan>
    <tspan x="28" dy="16">concurrent clients.</tspan>
  </text>
  <rect x="20" y="238" width="60" height="2" fill="#3dd6c6" opacity="0.4">
    <animate attributeName="width" values="30;120;30" dur="4.5s" repeatCount="indefinite"/>
  </rect>
</svg>
