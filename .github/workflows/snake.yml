# Generates a contribution-snake SVG via Platane/snk and pushes it to the `output` branch.
# README raw URL (after first successful run):
#   https://raw.githubusercontent.com/granzer69/granzer69/output/github-contribution-grid-snake.svg
#
# Also generates a github-dark palette variant for dark-mode <picture> if desired.

name: generate-snake

on:
  schedule:
    # daily
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#3dd6c6&color_dots=#0b0f14,#1a3a36,#1f6f66,#2a9d8f,#3dd6c6

      - name: push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
